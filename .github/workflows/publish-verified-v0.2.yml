name: Verify and publish v0.2.0

on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: publish-v0.2.0
  cancel-in-progress: false

jobs:
  cross-platform:
    name: Verify ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Reconstruct verified source history
        run: python .publish/prepare.py --output source
      - name: Install development dependencies
        working-directory: source
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run portable quality checks
        working-directory: source
        run: python scripts/quality_gate.py --skip-coverage --skip-wheel --skip-git

  native-builds:
    name: Build native executable / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Reconstruct verified source history
        run: python .publish/prepare.py --output source
      - name: Install release dependencies
        working-directory: source
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[release]"
      - name: Build native executable
        working-directory: source
        run: python scripts/build_standalone.py
      - name: Smoke-test native executable
        working-directory: source
        run: python scripts/smoke_standalone.py
      - uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ runner.os }}-${{ runner.arch }}
          path: source/dist/standalone/*
          if-no-files-found: error

  release-gate:
    name: Full release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Reconstruct verified source history
        run: python .publish/prepare.py --output source
      - name: Install development dependencies
        working-directory: source
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run complete release gate
        working-directory: source
        run: python scripts/quality_gate.py
      - name: Build Python distributions
        working-directory: source
        run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: |
            source/dist/*.whl
            source/dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish verified history and tags
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/publish-v0.2.0'
    needs: [cross-platform, native-builds, release-gate]
    runs-on: ubuntu-latest
    outputs:
      final-sha: ${{ steps.identity.outputs.final-sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct verified source history
        run: python .publish/prepare.py --output source
      - name: Record verified identity
        id: identity
        working-directory: source
        run: echo "final-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Create annotated release tag
        working-directory: source
        run: |
          git config user.name "Adaptive ISO Boot Release"
          git config user.email "73152895+siraht@users.noreply.github.com"
          git tag -a v0.2.0 -m "Adaptive ISO Boot v0.2.0"
      - name: Publish main and release tags
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: source
        run: |
          git remote remove origin || true
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:main
          git push --force origin refs/tags/v0.1.0 refs/tags/v0.2.0
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$(git rev-parse HEAD)"

  github-release:
    name: Publish GitHub release assets
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'agent/publish-v0.2.0'
    needs: [publish, native-builds, release-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Reconstruct verified source history
        run: python .publish/prepare.py --output source
      - name: Fetch the published release tag
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: source
        run: |
          git remote remove origin || true
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --force origin refs/tags/v0.2.0:refs/tags/v0.2.0
          test "$(git rev-parse 'refs/tags/v0.2.0^{}')" = "${{ needs.publish.outputs.final-sha }}"
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Assemble release payload and checksums
        run: |
          mkdir -p upload
          find release-assets -type f -exec cp {} upload/ \;
          git -C source bundle create "$GITHUB_WORKSPACE/upload/adaptive-iso-boot-0.2.0-complete-history.git.bundle" refs/heads/main refs/tags/v0.1.0 refs/tags/v0.2.0
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path("upload")
          files = sorted(path for path in root.iterdir() if path.is_file())
          (root / "SHA256SUMS.txt").write_text("".join(
              f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n"
              for path in files
          ), encoding="utf-8")
          PY
      - name: Create or refresh the v0.2.0 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.2.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v0.2.0 upload/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create v0.2.0 upload/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Adaptive ISO Boot v0.2.0" \
              --generate-notes
          fi
